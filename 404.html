<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Redirecting…</title>
<!-- Any missing path goes home. A single word like /kafin opens that poem. -->
<script>
(function(){
  var seg=(location.pathname||'').replace(/^\/+|\/+$/g,'').replace(/^poems?\//,'').toLowerCase();
  location.replace(/^[a-z0-9-]+$/.test(seg) ? '/?poem='+seg : '/');
})();
</script>
<meta http-equiv="refresh" content="0; url=/"/>
</head>
<body style="font-family:system-ui,sans-serif;background:#16222B;color:#E8EDEE;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0">
  <p>Taking you to the poems… <a href="/" style="color:#F2A5B1">Continue</a></p>
</body>
</html>
